name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# What Pages needs to accept an artifact and publish it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push queues behind the running one rather than
# racing it, so the live site is never assembled from two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Reports where Pages will serve this repository from, so the subpath is
      # never hard-coded: a custom domain later returns an empty base_path and
      # the build follows it without a code change.
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          # Next rejects a basePath with a trailing slash.
          export NEXT_PUBLIC_BASE_PATH="${base%/}"
          export NEXT_PUBLIC_SITE_URL="${{ steps.pages.outputs.base_url }}"
          pnpm build
      # Without this Pages runs Jekyll over the output, and Jekyll discards
      # every directory whose name starts with an underscore, which is where
      # Next puts the entire JS and CSS bundle. public/.nojekyll should already
      # have been copied here; this is the belt to that braces.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
